<!DOCTYPE html>
<html>
<head>
  <title>Be My Valentine? 💖</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: pink;
      overflow: hidden;
    }

    h1 {
      color: red;
    }

    .container {
      margin-top: 50px;
    }

    img {
      width: 200px;
      border-radius: 20px;
      margin: 10px;
      border: 3px solid white;
    }

    button {
      font-size: 20px;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      cursor: pointer;
    }

    #yes {
      background: green;
      color: white;
    }

    #no {
      background: red;
      color: white;
      position: absolute;
    }

    #message {
      display: none;
      font-size: 22px;
      color: purple;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Will You Be My Valentine? 💕</h1>

    <!-- Replace these with HER images -->
    <img src="fig4.jpg">
    <img src="fig5.jpg">
   

    <br><br>

    <button id="yes" onclick="showMessage()">Yes 💖</button>
    <button id="no" onmouseover="moveNo()">No 😢</button>

    <p id="message">
      Yayyyy! 💕  
      I knew you would say YES!  
      You are my favorite person forever 💞  
      Happy Valentine’s Day, my love!
    </p>
  </div>

<script>
function moveNo() {
  let x = Math.random() * window.innerWidth - 100;
  let y = Math.random() * window.innerHeight - 100;
  document.getElementById("no").style.left = x + "px";
  document.getElementById("no").style.top = y + "px";
}

function showMessage() {
  document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
