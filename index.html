<!DOCTYPE html>
<html>
<head>
  <title>Be My Valentine? 💖</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
      margin: 0;
      padding: 0;
    }

    h1 {
      color: #d00000;
      margin-top: 30px;
    }

    .container {
      margin-top: 30px;
    }

    .images {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    img {
      width: 350px;
      border-radius: 20px;
      border: 4px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    button {
      font-size: 20px;
      padding: 12px 25px;
      margin: 10px;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }

    #yes {
      background: #2ecc71;
      color: white;
    }

    #no {
      background: #e74c3c;
      color: white;
      position: absolute;
    }

    #message {
      display: none;
      font-size: 22px;
      color: #6a0572;
      margin-top: 25px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Will You Be My Valentine? 💕</h1>

    <div class="images">
      <img src="figure4.jpg" alt="Your image 1">
      <img src="figure5.jpg" alt="Your image 2">
    </div>

    <button id="yes" onclick="showMessage()">Yes 💖</button>
    <button id="no" onmouseover="moveNo()">No 😢</button>

    <p id="message">
      Yayyyy! 💕  
      I knew you would say YES!  
      You make my world brighter every day 🌸  
      Happy Valentine’s Day, my love!
    </p>
  </div>

<script>
function moveNo() {
  let x = Math.random() * (window.innerWidth - 150);
  let y = Math.random() * (window.innerHeight - 150);
  document.getElementById("no").style.left = x + "px";
  document.getElementById("no").style.top = y + "px";
}

function showMessage() {
  document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
