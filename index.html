<!DOCTYPE html>
<html>
<head>
  <title>Be My Valentine? 💖</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
      margin: 0;
      padding: 0;
    }

    h1 {
      color: #d00000;
      margin-top: 30px;
    }

    .container {
      margin-top: 30px;
    }

    .images {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    img {
      width: 350px;
      border-radius: 20px;
      border: 4px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: none;   /* Hidden at first */
    }

    .caption {
      display: none;
      font-size: 22px;
      color: #6a0572;
      margin-top: 15px;
      font-weight: bold;
    }

    button {
      font-size: 20px;
      padding: 12px 25px;
      margin: 10px;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }

    #yes {
      background: #2ecc71;
      color: white;
    }

    #no {
      background: #e74c3c;
      color: white;
      position: absolute;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 id="mainText">Will You Be My Valentine? 💕</h1>

    <div class="images">
      <div>
        <img id="img1" src="figure4.jpg" alt="Image 1">
        <p id="cap1" class="caption">✨ Our beautiful journey begins today… ✨</p>
      </div>

      <div>
        <img id="img2" src="figure5.jpg" alt="Image 2">
        <p id="cap2" class="caption">💞 You make my world brighter 💞</p>
      </div>
    </div>

    <button id="yes" onclick="startJourney()">Yes 💖</button>
    <button id="no" onmouseover="moveNo()">No 😢</button>

  </div>

<script>
function moveNo() {
  let x = Math.random() * (window.innerWidth - 150);
  let y = Math.random() * (window.innerHeight - 150);
  document.getElementById("no").style.left = x + "px";
  document.getElementById("no").style.top = y + "px";
}

function startJourney() {
  // Change heading
  document.getElementById("mainText").innerText = "Our Love Journey 💖";

  // Hide buttons
  document.getElementById("yes").style.display = "none";
  document.getElementById("no").style.display = "none";

  // Show first image + line
  setTimeout(() => {
    document.getElementById("img1").style.display = "block";
    document.getElementById("cap1").style.display = "block";
  }, 800);

  // Show second image + line
  setTimeout(() => {
    document.getElementById("img2").style.display = "block";
    document.getElementById("cap2").style.display = "block";
  }, 1800);
}
</script>

</body>
</html>
