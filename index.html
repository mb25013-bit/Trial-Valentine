<!DOCTYPE html>
<html>
<head>
  <title>Our Love Journey 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- SLIDE 1 -->
  <div class="slide active" id="slide1">
    <h1>Hey My Love 💕</h1>
    <p>I built this just for you… with all my heart.</p>
    <button onclick="nextSlide()">Start Our Journey</button>
  </div>

  <!-- SLIDE 2 (YOUR FIRST PHOTO) -->
  <div class="slide" id="slide2">
    <h2>Our Beautiful Memories 🌸</h2>
    <img src="figure4.jpg" class="photo">
    <button onclick="nextSlide()">Next</button>
  </div>

  <!-- SLIDE 3 (YOUR SECOND PHOTO) -->
  <div class="slide" id="slide3">
    <h2>And This One Too 💞</h2>
    <img src="figure5.jpg" class="photo">
    <button onclick="nextSlide()">Next</button>
  </div>

  <!-- SLIDE 4 (QUESTION) -->
  <div class="slide" id="slide4">
    <h1>Will You Be My Valentine? 💘</h1>

    <button id="yesBtn" onclick="sayYes()">YES 💖</button>
    <button id="noBtn" onmouseover="runAway()">NO 😢</button>

    <p id="result"></p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
